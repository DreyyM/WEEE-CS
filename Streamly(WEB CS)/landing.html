<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Streamly | Watch Something Great</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "DM Sans", sans-serif;
            color: white;
            background: #07070b;
            overflow: hidden;
        }

        .landing {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;

            background:
                linear-gradient(
                    90deg,
                    rgba(7, 7, 11, 0.95),
                    rgba(7, 7, 11, 0.65),
                    rgba(7, 7, 11, 0.85)
                ),
                linear-gradient(
                    0deg,
                    rgba(7, 7, 11, 0.9),
                    transparent 50%,
                    rgba(7, 7, 11, 0.5)
                ),
                url("https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=2000&q=90")
                center / cover;
        }

        .content {
            width: min(850px, 100%);
            animation: fadeUp 1s ease;
        }

        .logo {
            font-family: "Space Grotesk", sans-serif;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.08em;
            margin-bottom: 50px;
        }

        .logo span {
            color: #9b5cff;
        }

        .kicker {
            display: block;
            color: #b77cff;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.25em;
            margin-bottom: 18px;
        }

        h1 {
            font-family: "Space Grotesk", sans-serif;
            font-size: clamp(3.5rem, 10vw, 7rem);
            line-height: 0.9;
            letter-spacing: -0.07em;
            margin-bottom: 28px;
        }

        h1 em {
            font-style: normal;
            background: linear-gradient(
                90deg,
                #ffffff,
                #bf91ff,
                #f58bc0
            );
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .description {
            max-width: 600px;
            margin: 0 auto 35px;
            color: #c6c4ce;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .enter-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            padding: 15px 28px;
            border: none;
            border-radius: 999px;

            color: white;
            background: linear-gradient(
                135deg,
                #9b5cff,
                #ef4b9b
            );

            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;

            cursor: pointer;

            box-shadow: 0 15px 40px rgba(155, 92, 255, 0.3);

            transition:
                transform 0.25s ease,
                filter 0.25s ease,
                box-shadow 0.25s ease;
        }

        .enter-btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
            box-shadow: 0 20px 50px rgba(155, 92, 255, 0.4);
        }

        .enter-btn:active {
            transform: translateY(0);
        }

        .arrow {
            font-size: 1.2rem;
        }

        .footer-text {
            margin-top: 60px;
            color: #777582;
            font-size: 0.8rem;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .landing {
                padding: 25px;
            }

            .logo {
                margin-bottom: 35px;
            }

            h1 {
                font-size: clamp(3rem, 17vw, 5rem);
            }

            .description {
                font-size: 0.95rem;
            }

            .enter-btn {
                width: 100%;
                max-width: 300px;
            }

            .footer-text {
                margin-top: 40px;
            }
        }
    </style>
</head>

<body>

    <main class="landing">

        <div class="content">

            <div class="logo">
                STREAM<span>LY</span>
            </div>

            <span class="kicker">
                YOUR NEXT STORY STARTS HERE
            </span>

            <h1>
                Stories worth<br>
                <em>staying up for.</em>
            </h1>

            <p class="description">
                Discover movies, series, and trending stories
                all in one beautiful place.
            </p>

            <!-- Redirects to your existing home page -->
            <a href="index.html" class="enter-btn">
                Enter Streamly
                <span class="arrow">→</span>
            </a>

            <p class="footer-text">
                Movies • Series • Trending • More
            </p>

        </div>

    </main>

</body>
</html>
